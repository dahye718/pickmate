<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PickMate 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<div class="auth-container">
    <div class="logo">✨ PickMate</div>
    <p class="subtitle">고민되는 선택을 도와주는 나만의 선택 메이트</p>

    <h2>로그인</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="아이디" required>

        <div class="password-box">
            <input type="password" id="loginPassword" name="password" placeholder="비밀번호" required>
            <span class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</span>
        </div>

        <button type="submit">로그인</button>
    </form>

    <p class="move-text">
        <a href="/forgot_password">비밀번호를 잊으셨나요?</a>
    </p>

    <p class="move-text">
        아직 계정이 없다면?
        <a href="/register">회원가입</a>
    </p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</div>

<script>
function togglePassword(id, element) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        element.textContent = "🙈";
    } else {
        input.type = "password";
        element.textContent = "👁️";
    }
}
</script>

</body>
</html>

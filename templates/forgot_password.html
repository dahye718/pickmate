<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PickMate 비밀번호 찾기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<div class="auth-container">

    <div class="logo">✨ PickMate</div>
    <p class="subtitle">비밀번호를 잊어버렸나요?</p>

    <h2>비밀번호 찾기</h2>

    {% if success %}
        <p class="success">{{ success }}</p>

        <button onclick="location.href='/login'">
            로그인하러 가기
        </button>

    {% elif hint_question %}
        <div class="info-card">
            <h3>🔐 본인 확인 질문</h3>

            <div class="step">
                <span>?</span>
                {{ hint_question }}
            </div>
        </div>

        <form method="POST">
            <input type="hidden" name="step" value="reset_password">
            <input type="hidden" name="username" value="{{ username }}">

            <input
                type="text"
                name="hint_answer"
                placeholder="답변 입력"
                required
            >

            <div class="password-box">
                <input
                    type="password"
                    id="forgotPassword"
                    name="new_password"
                    placeholder="새 비밀번호 입력"
                    required
                >
                <span class="toggle-password" onclick="togglePassword('forgotPassword', this)">👁️</span>
            </div>

            <button type="submit">
                비밀번호 변경
            </button>
        </form>

        <button class="sub-btn" onclick="location.href='/forgot_password'">
            아이디 다시 입력하기
        </button>

    {% else %}
        <form method="POST">
            <input type="hidden" name="step" value="check_id">

            <input
                type="text"
                name="username"
                placeholder="아이디 입력"
                required
            >

            <button type="submit">
                질문 확인하기
            </button>
        </form>
    {% endif %}

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <p class="move-text">
        로그인 화면으로 돌아가기
        <a href="/login">로그인</a>
    </p>

</div>

<script>
function togglePassword(id, element) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        element.textContent = "🙈";
    } else {
        input.type = "password";
        element.textContent = "👁️";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PickMate 회원가입</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>
<div class="bg-circle circle3"></div>

<div class="auth-container">
    <div class="logo">✨ PickMate</div>
    <p class="subtitle">선택이 어려울 때 PickMate와 함께해보세요</p>

    <h2>회원가입</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="아이디" required>

        <div class="password-box">
            <input type="password" id="registerPassword" name="password" placeholder="비밀번호" required>
            <span class="toggle-password" onclick="togglePassword('registerPassword', this)">👁️</span>
        </div>

        <input
            type="text"
            name="hint_question"
            placeholder="비밀번호 찾기 질문 예: 내가 좋아하는 색은?"
            required
        >

        <input
            type="text"
            name="hint_answer"
            placeholder="비밀번호 찾기 답변"
            required
        >

        <button type="submit">가입하기</button>
    </form>

    <p class="move-text">
        이미 계정이 있다면?
        <a href="/login">로그인</a>
    </p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
</div>

<script>
function togglePassword(id, element) {
    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
        element.textContent = "🙈";
    } else {
        input.type = "password";
        element.textContent = "👁️";
    }
}
</script>

</body>
</html>
